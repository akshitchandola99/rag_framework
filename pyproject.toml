[project]
name = "ragqa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "akshitchandola99", email = "akshitchandola99@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2",
]

[project.scripts]
ragqa = "ragqa:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a running Ollama server and downloaded models",
]
